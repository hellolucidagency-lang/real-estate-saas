<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== عناصر Meta الأساسية (سيتم تحديثها ديناميكياً بواسطة JS) ===== -->
  <title id="page-title">جاري التحميل...</title>
  <meta name="description" id="meta-description" content="اكتشف أفضل العقارات المتاحة." />

  <!-- Open Graph (يُستخدم عند مشاركة الرابط على واتساب/فيسبوك) -->
  <!-- ملاحظة مهمة: هذه الوسوم يتم تعديلها بجافاسكريبت بعد تحميل الصفحة،
       لذلك برامج الزحف (Crawlers) الخاصة بواتساب/فيسبوك التي لا تنفّذ JS
       قد لا ترى القيم المحدثة. للحصول على معاينة مشاركة مثالية بنسبة 100%
       لكل عميل، ستحتاج لاحقاً لحل من جهة الخادم (مثل Cloudflare Worker
       بسيط يُدرج القيم قبل الإرسال). حالياً القيم تعمل بشكل ممتاز
       داخل المتصفح وفي فحص الروابط اللاحقة. -->
  <meta property="og:title" id="og-title" content="منصة العقارات" />
  <meta property="og:description" id="og-description" content="اكتشف أفضل العقارات المتاحة." />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:type" content="website" />

  <!-- Favicon (يُستبدل ديناميكياً) -->
  <link rel="icon" id="favicon" href="" type="image/png" />

  <!-- خطوط: خط عرض (Display) للعناوين + خط للنصوص -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS عبر CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      /* ===== هذا هو اللون الأساسي الذي يتغيّر تلقائياً حسب بيانات العميل (Theme_Color) ===== */
      --theme-color: #16302B; /* لون افتراضي (احتياطي) قبل وصول بيانات Airtable */
      --theme-color-soft: #16302B1a; /* نفس اللون بشفافية خفيفة، يُحسب تلقائياً */
    }

    html, body {
      font-family: 'Tajawal', sans-serif;
      background-color: #FAF9F6;
      color: #1C1C1A;
    }

    .font-display {
      font-family: 'Cairo', sans-serif;
    }

    /* عناصر تعتمد على لون العميل الديناميكي */
    .theme-bg { background-color: var(--theme-color); }
    .theme-text { color: var(--theme-color); }
    .theme-border { border-color: var(--theme-color); }
    .theme-ring:focus { outline: 2px solid var(--theme-color); }

    /* شاشة التحميل */
    #loading-screen {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: #FAF9F6;
      transition: opacity .4s ease;
    }
    .spinner {
      width: 40px; height: 40px; border-radius: 999px;
      border: 3px solid #e5e1d8;
      border-top-color: var(--theme-color);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* تأثير خفيف عند تمرير الماوس فوق كرت العقار */
    .property-card { transition: transform .35s ease, box-shadow .35s ease; }
    .property-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -20px rgba(0,0,0,.25); }

    .image-scroll { scroll-snap-type: x mandatory; }
    .image-scroll > div { scroll-snap-align: start; }
    .image-scroll::-webkit-scrollbar { display: none; }

    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body class="min-h-screen">

  <!-- ============ شاشة التحميل ============ -->
  <div id="loading-screen">
    <div class="spinner"></div>
  </div>

  <!-- ============ حالة الخطأ (عميل غير موجود) ============ -->
  <div id="error-screen" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-[#FAF9F6] px-6 text-center">
    <div>
      <p class="font-display text-2xl font-bold mb-2">لم يتم العثور على هذا الحساب</p>
      <p class="text-neutral-500" id="error-message">تأكد من صحة الرابط الذي بحوزتك.</p>
    </div>
  </div>

  <!-- ============ المحتوى الرئيسي ============ -->
  <div id="app" class="hidden">

    <!-- ===== الهيدر ===== -->
    <header class="sticky top-0 z-30 backdrop-blur bg-[#FAF9F6]/90 border-b border-neutral-200">
      <div class="max-w-6xl mx-auto px-5 md:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img id="client-logo" src="" alt="شعار الشركة" class="h-10 w-10 rounded-full object-cover hidden" />
          <span id="client-name" class="font-display text-xl font-bold theme-text">—</span>
        </div>
        <a id="header-whatsapp" href="#" target="_blank" rel="noopener"
           class="theme-bg text-white text-sm font-medium px-4 py-2 rounded-full hover:opacity-90 transition">
          تواصل عبر واتساب
        </a>
      </div>
    </header>

    <!-- ===== قسم Hero ===== -->
    <section class="max-w-6xl mx-auto px-5 md:px-8 pt-14 pb-10">
      <p class="text-xs tracking-[0.25em] uppercase text-neutral-400 mb-3">قائمة العقارات المتاحة</p>
      <h1 class="font-display text-3xl md:text-5xl font-extrabold leading-tight max-w-2xl">
        عقارات مختارة بعناية من
        <span id="hero-client-name" class="theme-text">—</span>
      </h1>
      <p class="text-neutral-500 mt-4 max-w-lg" id="properties-count">جاري تحميل العقارات...</p>
    </section>

    <!-- ===== شبكة العقارات ===== -->
    <main class="max-w-6xl mx-auto px-5 md:px-8 pb-24">
      <div id="properties-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="empty-properties" class="hidden text-center py-20 text-neutral-400">
        لا توجد عقارات متاحة حالياً.
      </div>
    </main>

    <!-- ===== فوتر ===== -->
    <footer class="border-t border-neutral-200 py-8 text-center text-sm text-neutral-400">
      <span id="footer-client-name">—</span> · جميع الحقوق محفوظة
    </footer>

    <!-- ===== زر واتساب عائم ===== -->
    <a id="floating-whatsapp" href="#" target="_blank" rel="noopener"
       class="theme-bg fixed bottom-6 left-6 z-30 hidden items-center justify-center w-14 h-14 rounded-full text-white shadow-lg hover:scale-105 transition">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7">
        <path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.77.46 3.45 1.27 4.9L2 22l5.25-1.38A9.96 9.96 0 0 0 12.04 22c5.52 0 10-4.48 10-10s-4.48-10-10-10zm0 18.2c-1.62 0-3.15-.44-4.47-1.22l-.32-.19-3.11.82.83-3.03-.21-.31A8.18 8.18 0 0 1 3.8 12c0-4.55 3.7-8.24 8.24-8.24 4.55 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.53.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43-.14-.01-.31-.01-.48-.01a.93.93 0 0 0-.67.31c-.23.25-.87.85-.87 2.08s.89 2.41 1.02 2.58c.12.17 1.75 2.67 4.24 3.74.59.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28z"/>
      </svg>
    </a>

  </div>

  <!-- ===== Template مخفي لكرت العقار (يُستخدم بواسطة app.js) ===== -->
  <template id="property-card-template">
    <div class="property-card bg-white rounded-2xl overflow-hidden border border-neutral-200 fade-in">
      <div class="relative">
        <div class="image-scroll flex overflow-x-auto w-full h-56"></div>
        <div class="dots absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1"></div>
        <span class="price-badge absolute top-3 right-3 theme-bg text-white text-sm font-bold px-3 py-1 rounded-full"></span>
      </div>
      <div class="p-5">
        <div class="flex items-center gap-2 mb-1">
          <h3 class="title font-display font-bold text-lg"></h3>
          <span class="status-badge text-xs font-medium px-2 py-0.5 rounded-full bg-neutral-100 text-neutral-500"></span>
        </div>
        <p class="location text-sm text-neutral-400 mb-1"></p>
        <p class="offer-type text-xs font-medium theme-text mb-3"></p>
        <div class="meta flex items-center gap-4 text-sm text-neutral-500 mb-3"></div>
        <p class="description text-sm text-neutral-500 mb-4 line-clamp-2"></p>
        <a class="card-whatsapp block text-center theme-bg text-white text-sm font-medium py-2.5 rounded-xl hover:opacity-90 transition" target="_blank" rel="noopener">
          استفسر عن هذا العقار
        </a>
      </div>
    </div>
  </template>

  <!-- ===== ملفات الإعداد والمنطق ===== -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

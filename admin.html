<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | إدارة العقارات والهوية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .tab-active { border-bottom: 3px solid #111827; font-weight: 700; color: #111827; }
    .tab-inactive { color: #6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <!-- شاشة الدخول -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">
      <h2 class="text-xl font-bold text-gray-900 mb-2">لوحة التحكم</h2>
      <p class="text-sm text-gray-500 mb-6">أدخل كلمة المرور للمتابعة</p>
      <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-center mb-4 focus:ring-2 focus:ring-gray-800 outline-none" />
      <button onclick="checkPass()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-black transition">دخول</button>
      <p id="pass-err" class="text-red-600 text-sm mt-3 hidden">كلمة المرور غير صحيحة</p>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="main-app" class="hidden max-w-4xl mx-auto p-4 md:p-8">
    
    <!-- الهيدر والتبويبات -->
    <header class="flex flex-col md:flex-row items-center justify-between border-b border-gray-200 pb-4 mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-black text-gray-900">لوحة تحكم المكتب</h1>
        <p class="text-sm text-gray-500">إدارة العقارات والوحدات وتخصيص هوية الموقع</p>
      </div>
      <button onclick="logout()" class="text-sm text-red-600 font-semibold hover:underline">تسجيل الخروج</button>
    </header>

    <!-- أزرار التبديل (Tabs) -->
    <div class="flex border-b border-gray-200 mb-8">
      <button id="tab-btn-properties" onclick="switchTab('properties')" class="tab-active py-3 px-6 text-sm transition">🏢 إضافة وإدارة العقارات</button>
      <button id="tab-btn-settings" onclick="switchTab('settings')" class="tab-inactive py-3 px-6 text-sm transition">⚙️ إعدادات وهيكل المكتب</button>
    </div>

    <!-- 1. تبويب العقارات -->
    <section id="section-properties" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="text-lg font-bold mb-4 text-gray-900">إضافة عقار جديد</h3>
      <form id="property-form" onsubmit="handlePropertySubmit(event)" class="space-y-4">
        
        <div>
          <label class="block text-sm font-semibold mb-1">اسم / عنوان العقار *</label>
          <input type="text" id="prop-title" required placeholder="مثال: شقة للبيع في التجمع الخامس فيو جاردن" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">المنطقة / الموقع *</label>
            <input type="text" id="prop-location" required placeholder="مثال: التجمع الخامس، النرجس" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">السعر (ج.م) *</label>
            <input type="number" id="prop-price" required placeholder="مثال: 3500000" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">المساحة (م²) *</label>
            <input type="number" id="prop-area" required placeholder="مثال: 180" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">عدد الغرف</label>
            <input type="number" id="prop-rooms" placeholder="مثال: 3" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">عدد الحمامات</label>
            <input type="number" id="prop-baths" placeholder="مثال: 2" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">حالة العقار *</label>
            <select id="prop-status" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm bg-white">
              <option value="متاح">متاح</option>
              <option value="مباع">مباع / مؤجر</option>
              <option value="قريباً">قريباً</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">صور العقار (يمكن اختيار صور متعددة) *</label>
          <input type="file" id="prop-images" multiple accept="image/*" required class="w-full border border-dashed border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-gray-800 outline-none" />
          <p class="text-xs text-gray-500 mt-1">اضغطي مع الاستمرار على Ctrl لتحديد أكثر من صورة في وقت واحد.</p>
        </div>

        <button type="submit" id="prop-submit-btn" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-black transition text-sm">
          حفظ ونشر العقار
        </button>
        <p id="prop-msg" class="text-center text-sm font-semibold mt-2 hidden"></p>
      </form>
    </section>

    <!-- 2. تبويب إعدادات الهوية -->
    <section id="section-settings" class="hidden bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
      <h3 class="text-lg font-bold mb-4 text-gray-900">هوية وبيانات المكتب</h3>
      <form id="settings-form" onsubmit="handleSettingsSubmit(event)" class="space-y-4">
        
        <div>
          <label class="block text-sm font-semibold mb-1">اسم المكتب / الشركة العقارية</label>
          <input type="text" id="setting-agency-name" placeholder="مثال: تراست إستيت للوساطة العقارية" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">رقم الواتساب (مع كود الدولة)</label>
            <input type="text" id="setting-whatsapp" placeholder="مثال: 201012345678" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-gray-800 outline-none text-sm" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">لون السيم الأساسي (Brand Color)</label>
            <div class="flex items-center gap-3">
              <input type="color" id="setting-color" value="#0f172a" class="h-10 w-20 rounded border border-gray-300 cursor-pointer" />
              <span class="text-xs text-gray-500">اختر لون هوية العميل ليتلون به موقعه بالكامل</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">لوجو المكتب</label>
          <input type="file" id="setting-logo" accept="image/*" class="w-full border border-dashed border-gray-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-gray-800 outline-none" />
        </div>

        <button type="submit" id="settings-submit-btn" class="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl hover:bg-black transition text-sm">
          حفظ إعدادات الهوية
        </button>
        <p id="settings-msg" class="text-center text-sm font-semibold mt-2 hidden"></p>
      </form>
    </section>

  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>

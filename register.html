<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوسيديا | أطلق منصتك الاحترافية في 3 دقائق</title>
  <meta name="description" content="منصة لوسيديا - أطلق منصتك الاحترافية لإدارة العقارات، العيادات، والاستشارات القانونية في 3 دقائق مع تجربة مجانية.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- ربط ملف الإعدادات -->
  <script src="config.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-50">

  <div class="glass-card w-full max-w-md rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-blue-600 p-6 text-center flex flex-col items-center justify-center">
      <img src="https://res.cloudinary.com/fig3bixy/image/upload/v1787504073/LUCID_svbv9m.jpg" alt="Lucid Agency" class="h-12 w-auto object-contain rounded-xl shadow-sm mb-3 bg-white p-1">
      <h1 class="text-2xl font-black text-white tracking-wide">لوسيديا</h1>
      <p class="text-blue-100 text-xs mt-1">أطلق منصتك الاحترافية في 3 دقائق</p>
    </div>

    <!-- Form -->
    <div class="p-6 md:p-8">
      <div class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-2.5 rounded-xl text-center mb-5 border border-blue-100">
        🎉 استمتع بـ 14 يوم تجربة مجانية بالكامل
      </div>

      <form id="register-form" class="space-y-4">
        
        <!-- Custom Sector Dropdown -->
        <div class="relative">
          <label class="block text-xs font-bold text-slate-700 mb-1">مجال عملك *</label>
          <input type="hidden" id="sector" name="sector" value="Lucidia Estate">
          
          <button type="button" id="custom-select-btn" class="w-full flex items-center justify-between px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            <span id="selected-option-text">🏢 تسويق عقاري</span>
            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>

          <div id="custom-select-menu" class="hidden absolute z-30 w-full mt-1 bg-white border border-slate-100 rounded-xl shadow-lg overflow-hidden">
            <div class="option-item px-4 py-3 hover:bg-blue-50 text-sm cursor-pointer transition-colors border-b border-slate-50 flex items-center gap-2" data-value="Lucidia Estate" data-label="🏢 تسويق عقاري">
              <span>🏢</span> <span>تسويق عقاري</span>
            </div>
            <div class="option-item px-4 py-3 hover:bg-blue-50 text-sm cursor-pointer transition-colors border-b border-slate-50 flex items-center gap-2" data-value="Lucidia Clinics" data-label="🩺 عيادات ورعاية صحية">
              <span>🩺</span> <span>عيادات ورعاية صحية</span>
            </div>
            <div class="option-item px-4 py-3 hover:bg-blue-50 text-sm cursor-pointer transition-colors flex items-center gap-2" data-value="Lucidia Pro" data-label="⚖️ استشارات قانونية ومحاماة">
              <span>⚖️</span> <span>استشارات قانونية ومحاماة</span>
            </div>
          </div>
        </div>

        <!-- Business Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">اسم الشركة أو العيادة *</label>
          <input type="text" id="company_name" placeholder="مثال: النور للعقارات / عيادات د. أحمد" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700 text-sm bg-white">
        </div>

        <!-- WhatsApp -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">رقم الواتساب (لاستقبال الحجوزات) *</label>
          <input type="tel" id="whatsapp" placeholder="010XXXXXXXX" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700 dir-ltr text-right text-sm bg-white">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور للوحة التحكم *</label>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700 text-sm bg-white">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-blue-200 hover:shadow-lg mt-2 text-sm">
          إنشاء حسابي مجاناً 🚀
        </button>
      </form>

      <!-- Domain Note & Support Link -->
      <div class="mt-4 p-3 bg-slate-50 border border-slate-100 rounded-xl text-center">
        <p class="text-[11px] text-slate-600 leading-relaxed">
          🌐 <strong>نطاقك المخصص:</strong> يمكنك ربط دومينك الخاص بسهولة من لوحة التحكم، أو 
          <a href="https://wa.me/201111197146?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D9%85%D9%86%D8%B5%D8%A9%20%D9%84%D9%88%D8%B3%D9%8A%D8%AF%D9%8A%D8%A7%20%D9%88%D8%B4%D8%B1%D8%A7%D8%A1%20%D8%AF%D9%88%D9%85%D9%8A%D9%86%20%D9%85%D8%AE%D8%B5%D8%A9" target="_blank" class="text-blue-600 font-bold hover:underline inline-flex items-center gap-1">
            <span>تواصل مع الدعم الفني</span>
            <span class="text-emerald-500 font-normal">(واتساب)</span>
          </a>
          لمساعدتك في شراء وربط نطاقك.
        </p>
      </div>

      <!-- Loading / Success / Error Messages -->
      <div id="status-msg" class="hidden mt-4 text-center text-xs font-bold p-3 rounded-lg"></div>
    </div>
  </div>

  <script>
    // التحكم في القائمة المنسدلة المخصصة
    const selectBtn = document.getElementById('custom-select-btn');
    const selectMenu = document.getElementById('custom-select-menu');
    const sectorInput = document.getElementById('sector');
    const selectedText = document.getElementById('selected-option-text');

    selectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      selectMenu.classList.toggle('hidden');
    });

    document.querySelectorAll('.option-item').forEach(item => {
      item.addEventListener('click', () => {
        const val = item.getAttribute('data-value');
        const label = item.getAttribute('data-label');
        sectorInput.value = val;
        selectedText.innerText = label;
        selectMenu.classList.add('hidden');
      });
    });

    document.addEventListener('click', () => {
      if (!selectMenu.classList.contains('hidden')) {
        selectMenu.classList.add('hidden');
      }
    });

    // معالجة نموذج التسجيل
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const msgBox = document.getElementById('status-msg');
      
      const payload = {
        type: 'register_client',
        sector: document.getElementById('sector').value,
        company_name: document.getElementById('company_name').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim(),
        password: document.getElementById('password').value
      };

      btn.innerText = 'جاري التجهيز... ⏳';
      btn.disabled = true;
      btn.classList.add('opacity-70');
      msgBox.classList.add('hidden');

      try {
        const res = await fetch(CONFIG.WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const resData = await res.json().catch(() => ({}));
          
          // حفظ بيانات الجلسة عشان لوحة التحكم تفتح بحساب العميل مباشرة
          localStorage.setItem('lucidia_whatsapp', payload.whatsapp);
          localStorage.setItem('lucidia_password', payload.password);
          if (resData.client_slug) {
            localStorage.setItem('lucidia_client_slug', resData.client_slug);
          }

          msgBox.className = 'mt-4 text-center text-xs font-bold p-3 rounded-lg bg-green-50 text-green-700 border border-green-200';
          msgBox.innerText = '✅ تم إنشاء حسابك بنجاح! سيتم تحويلك للوحة التحكم...';
          msgBox.classList.remove('hidden');
          
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 1500);
        } else {
          throw new Error('حدث خطأ في الخادم');
        }
      } catch (err) {
        msgBox.className = 'mt-4 text-center text-xs font-bold p-3 rounded-lg bg-red-50 text-red-700 border border-red-200';
        msgBox.innerText = '❌ حدث خطأ، يرجى المحاولة مرة أخرى.';
        msgBox.classList.remove('hidden');
        btn.innerText = 'إنشاء حسابي مجاناً 🚀';
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوسيديا | إنشاء منصتك الذكية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- ربط ملف الإعدادات -->
  <script src="config.js"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-card w-full max-w-md rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-blue-600 p-8 text-center">
      <h1 class="text-3xl font-extrabold text-white mb-2">لوسيديا</h1>
      <p class="text-blue-100 text-sm">أطلق منصتك الاحترافية في 3 دقائق</p>
    </div>

    <!-- Form -->
    <div class="p-8">
      <div class="bg-blue-50 text-blue-700 text-xs font-bold px-3 py-2 rounded-lg text-center mb-6">
        🎉 استمتع بـ 14 يوم تجربة مجانية بالكامل
      </div>

      <form id="register-form" class="space-y-5">
        
        <!-- Sector Selection -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">مجال عملك *</label>
          <select id="sector" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700 bg-white">
            <option value="عقارات">🏢 تسويق عقاري</option>
            <option value="عيادات">🩺 عيادات ورعاية صحية</option>
            <option value="محاماة">⚖️ استشارات قانونية ومحاماة</option>
          </select>
        </div>

        <!-- Business Name -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">اسم الشركة أو العيادة *</label>
          <input type="text" id="company_name" placeholder="مثال: النور للعقارات / عيادات د. أحمد" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700">
        </div>

        <!-- WhatsApp -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">رقم الواتساب (لاستقبال الحجوزات) *</label>
          <input type="tel" id="whatsapp" placeholder="مثال: 01012345678" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700 dir-ltr text-right">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">كلمة المرور للوحة التحكم *</label>
          <input type="password" id="password" placeholder="••••••••" required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-slate-700">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md mt-4">
          إنشاء حسابي مجاناً 🚀
        </button>
      </form>

      <!-- Loading / Success / Error Messages -->
      <div id="status-msg" class="hidden mt-4 text-center text-sm font-bold p-3 rounded-lg"></div>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const msgBox = document.getElementById('status-msg');
      
      // تجهيز البيانات
      const payload = {
        type: 'register_client', // الكلمة السحرية اللي n8n مستنيها
        sector: document.getElementById('sector').value,
        company_name: document.getElementById('company_name').value,
        whatsapp: document.getElementById('whatsapp').value,
        password: document.getElementById('password').value
      };

      // تغيير شكل الزرار
      btn.innerText = 'جاري التجهيز... ⏳';
      btn.disabled = true;
      btn.classList.add('opacity-70');
      msgBox.classList.add('hidden');

      try {
        // إرسال البيانات للـ Webhook
        const res = await fetch(CONFIG.WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          msgBox.className = 'mt-4 text-center text-sm font-bold p-3 rounded-lg bg-green-50 text-green-700';
          msgBox.innerText = '✅ تم إنشاء حسابك بنجاح! سيتم تحويلك للوحة التحكم...';
          msgBox.classList.remove('hidden');
          
          // بعد ثانيتين، نحوله لصفحة لوحة التحكم
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 2000);
        } else {
          throw new Error('حدث خطأ في الخادم');
        }
      } catch (err) {
        msgBox.className = 'mt-4 text-center text-sm font-bold p-3 rounded-lg bg-red-50 text-red-700';
        msgBox.innerText = '❌ حدث خطأ، يرجى المحاولة مرة أخرى.';
        msgBox.classList.remove('hidden');
        btn.innerText = 'إنشاء حسابي مجاناً 🚀';
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
